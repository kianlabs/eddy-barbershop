<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eddy Barbershop">
  <defs>
    <linearGradient id="favicon-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc246"/>
      <stop offset="1" stop-color="#b08d1e"/>
    </linearGradient>
  </defs>

  <!-- Kanvas terang, senada tema Apple Glass. -->
  <rect width="512" height="512" rx="96" fill="#f8f9fb"/>

  <!-- Monogram "E" emas (artwork sama dengan public/icon.svg). -->
  <g fill="none" stroke="url(#favicon-gold)" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 156 H196 V256 H300"/>
    <path d="M196 256 V356 H318"/>
  </g>

  <!-- Aksen garis bawah emas. -->
  <rect x="196" y="386" width="122" height="20" rx="10" fill="url(#favicon-gold)"/>
</svg>
