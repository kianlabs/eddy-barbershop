<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c9a227">
    <title>Offline — Eddy Barbershop</title>
    <style>
        :root {
            --gold: #c9a227;
            --ink: #1d1d1f;
            --ink-soft: #6e6e73;
            --canvas: #f8f9fb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--canvas);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .card {
            max-width: 380px;
            padding: 40px 32px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 22px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
        p { margin: 0 0 24px; color: var(--ink-soft); line-height: 1.55; font-size: 15px; }
        button {
            appearance: none;
            border: 0;
            cursor: pointer;
            padding: 13px 26px;
            border-radius: 999px;
            background: var(--gold);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icon.svg" alt="Eddy Barbershop" width="72" height="72">
        <h1>Kamu sedang offline</h1>
        <p>Koneksi internet terputus. Halaman booking butuh koneksi — coba lagi setelah terhubung.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
