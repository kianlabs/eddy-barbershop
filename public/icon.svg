<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eddy Barbershop">
  <defs>
    <linearGradient id="canvas" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc246"/>
      <stop offset="1" stop-color="#b08d1e"/>
    </linearGradient>
  </defs>

  <!-- Maskable-safe: full-bleed canvas, artwork confined to the inner 80% safe zone. -->
  <rect width="512" height="512" fill="url(#canvas)"/>

  <!-- Monogram "E" -->
  <g fill="none" stroke="url(#gold)" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 156 H196 V256 H300"/>
    <path d="M196 256 V356 H318"/>
  </g>

  <!-- Gold accent underline (brand accent) -->
  <rect x="196" y="386" width="122" height="20" rx="10" fill="url(#gold)"/>
</svg>
